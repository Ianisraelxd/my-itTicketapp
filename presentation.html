<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus HelpDesk — Presentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    />
    <!-- React + Babel via CDN so JSX runs in the browser with no build step. -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "DM Sans", sans-serif; color: #17202a; }
      button { font-family: inherit; cursor: pointer; }

      :root {
        --ink: #17202a;
        --muted: #78827e;
        --line: #e2e8e4;
        --green: #1c6b56;
        --green-dark: #104c3d;
        --mint: #e7f0eb;
        --gold: #bd8128;
        --blue: #39759d;
      }

      .app-shell { min-height: 100vh; display: flex; background: #f4f6f5 }
      .sidebar {
        width: 256px; flex: 0 0 256px; background: var(--green-dark);
        color: #e4f0eb; padding: 31px 22px 25px; display: flex; flex-direction: column
      }
      .brand, .auth-brand {
        display: flex; align-items: center; gap: 11px; color: white;
        font-family: Manrope, sans-serif; font-size: 12px; line-height: 1.1; letter-spacing: .5px
      }
      .brand strong, .auth-brand strong { font-size: 18px; letter-spacing: -1px }
      .brand-mark {
        width: 35px; height: 35px; display: inline-grid; place-items: center;
        background: #bbd887; color: var(--green-dark); border-radius: 50%; font: 700 27px/1 Manrope, sans-serif
      }
      .sidebar-user {
        display: flex; align-items: center; gap: 11px; margin: 51px 0 33px; padding: 13px 10px;
        border-top: 1px solid #ffffff29; border-bottom: 1px solid #ffffff29
      }
      .avatar {
        width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center;
        color: var(--green-dark); background: #c2d9c8; font-weight: 700
      }
      .sidebar-user strong, .sidebar-user span { display: block; font-size: 12px }
      .sidebar-user span:last-child { color: #9bb8ad; margin-top: 2px; font-size: 10px }
      .nav-list { display: grid; gap: 5px }
      .nav-list button, .logout-button {
        border: 0; background: transparent; color: #a9c1b7; text-align: left; padding: 12px 13px;
        border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 13px
      }
      .nav-list button span, .logout-button span { width: 16px; text-align: center; font-size: 16px }
      .nav-list button.active, .nav-list button:hover { background: #276c59; color: white }
      .logout-button { margin-top: 22px; border-top: 1px solid #ffffff29; border-radius: 0; padding-top: 27px }
      .sidebar-footer { margin-top: auto; color: #709385; font: 9px/1.6 Manrope, sans-serif; letter-spacing: 1.4px }
      .sidebar-footer span { font-family: 'DM Sans', sans-serif; letter-spacing: 0; color: #87a79a }
      .main-content { flex: 1; padding: 59px clamp(28px, 6vw, 90px); max-width: 1440px; margin: auto; width: 100% }
      .mobile-header { display: none }
      .page-header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 43px }
      .eyebrow { color: #82908a; font: 600 9px/1.2 Manrope, sans-serif; letter-spacing: 1.5px }
      .page-header h1 {
        margin: 10px 0 7px; color: var(--ink);
        font: 700 clamp(27px, 3vw, 37px)/1.1 Manrope, sans-serif; letter-spacing: -1.6px
      }
      .page-header p, .panel p { margin: 0; color: var(--muted); font-size: 13px }
      .button {
        border: 0; border-radius: 5px; padding: 13px 18px; color: white; font-size: 12px;
        font-weight: 700; transition: transform .2s, background .2s
      }
      .button:hover { transform: translateY(-2px) }
      .button span { margin-left: 16px; font-size: 16px }
      .button-primary { background: var(--green) }
      .button-primary:hover { background: #145440 }
      .button-dark { background: var(--ink) }
      .full-width { width: 100% }
      .link-button, .text-button, .auth-links button {
        border: 0; background: transparent; color: var(--green); font-size: 11px; font-weight: 700; padding: 0
      }
      .link-button:hover, .text-button:hover, .auth-links button:hover { text-decoration: underline }
      .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 25px }
      .stat-card {
        min-height: 144px; background: white; padding: 22px 21px 17px;
        border-top: 3px solid var(--green); box-shadow: 0 5px 20px #223f3209
      }
      .stat-card.gold { border-color: #d3a05b }
      .stat-card.blue { border-color: #6195b5 }
      .stat-card.green { border-color: #73a879 }
      .stat-card span { display: block; color: var(--muted); font-size: 11px }
      .stat-card strong { display: block; color: var(--ink); font: 700 34px/1.2 Manrope, sans-serif; margin: 13px 0 14px }
      .stat-card small { color: #a0aaa5; font-size: 9px }
      .stat-card small b { color: var(--green); font-size: 13px }
      .content-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(230px, .75fr); gap: 18px }
      .panel { background: #fff; padding: 26px 28px; box-shadow: 0 5px 20px #223f3209; margin-bottom: 20px }
      .panel-heading { display: flex; align-items: start; justify-content: space-between; gap: 15px; margin-bottom: 25px }
      .panel h2 { margin: 8px 0 0; font: 700 19px Manrope, sans-serif; letter-spacing: -.7px }
      .quick-panel { background: #dfeee6; position: relative; overflow: hidden }
      .quick-panel:after {
        content: '+'; position: absolute; right: -12px; top: -39px; color: #1c6b5614; font: 200 190px Manrope
      }
      .quick-panel h2 { max-width: 160px; margin: 10px 0 }
      .quick-panel p { max-width: 220px; line-height: 1.6; margin-bottom: 25px }
      .support-line { margin-top: 38px; padding-top: 15px; border-top: 1px solid #1c6b5629; color: #6d8c7d; font-size: 10px }
      .support-line strong { display: block; color: var(--green); margin-top: 5px }
      .table-wrap { overflow-x: auto }
      table { width: 100%; border-collapse: collapse; min-width: 620px }
      th, td { padding: 13px 7px; border-bottom: 1px solid #edf1ef; text-align: left; font-size: 11px; color: #697670; white-space: nowrap }
      th { color: #9aa59f; font: 600 9px Manrope; letter-spacing: 1px; text-transform: uppercase }
      td strong { color: var(--ink); font-weight: 700 }
      .priority, .status { font-size: 10px }
      .priority { padding: 5px 8px; border-radius: 3px }
      .priority-high { color: #a44b45; background: #fae7e3 }
      .priority-medium { color: #97713d; background: #f9efd9 }
      .priority-low { color: #52766a; background: #e6f1eb }
      .status { color: #718079 }
      .status i {
        width: 5px; height: 5px; margin-right: 6px; border-radius: 50%; display: inline-block;
        background: #d89e38; vertical-align: middle
      }
      .status-in-progress i { background: #5d9bbd }
      .status-resolved i, .status-active i { background: #6ea373 }
      .table-count { color: var(--muted); font-size: 10px }
      .table-button {
        border: 1px solid var(--green); color: white; background: var(--green);
        padding: 7px 11px; border-radius: 3px; font-size: 10px; font-weight: 700
      }
      .table-button.light { color: var(--ink); background: #f0f4f1; border-color: #e1e8e3 }
      .table-button:disabled { background: #e2e9e4; color: #7d9187; border-color: transparent }
      .request-form { max-width: 800px }
      .form-intro { display: flex; gap: 16px; padding-bottom: 27px; margin-bottom: 25px; border-bottom: 1px solid var(--line) }
      .form-number { color: var(--green); font: 700 14px Manrope }
      .form-intro h2 { margin: 0 0 5px }
      .form-intro p { font-size: 12px }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px }
      .field-label { display: block; color: #55645d; font-size: 11px; font-weight: 700; margin-bottom: 18px }
      .field-label input, .field-label select, .field-label textarea {
        display: block; width: 100%; margin-top: 8px; padding: 12px 13px; border: 1px solid #dce5df;
        border-radius: 4px; color: var(--ink); background: #fff; outline: none; font-size: 12px
      }
      .field-label textarea { min-height: 115px; resize: vertical }
      .field-label input:focus, .field-label select:focus, .field-label textarea:focus {
        border-color: var(--green); box-shadow: 0 0 0 3px #1c6b561a
      }
      .form-footer {
        display: flex; align-items: center; justify-content: space-between; gap: 18px;
        margin-top: 8px; padding-top: 22px; border-top: 1px solid var(--line)
      }
      .form-footer span { color: var(--muted); font-size: 10px }
      .action-panel { display: flex; justify-content: space-between; gap: 30px; align-items: start }
      .admin-actions { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 10px; flex: 1 }
      .admin-actions button {
        text-align: left; border: 1px solid var(--line); background: #fff; padding: 15px; color: var(--ink); border-radius: 3px
      }
      .admin-actions button:hover { border-color: var(--green) }
      .admin-actions span { display: block; color: var(--green); font-size: 20px; margin-bottom: 12px }
      .admin-actions strong, .admin-actions small { display: block }
      .admin-actions strong { font-size: 11px }
      .admin-actions small { color: var(--muted); margin-top: 4px; font-size: 9px }
      .empty-action { text-align: center; max-width: 650px; margin: 0 auto; padding: 55px 20px }
      .empty-icon, .modal-icon {
        width: 42px; height: 42px; display: grid; place-items: center; margin: 0 auto 18px;
        border-radius: 50%; color: var(--green); background: var(--mint); font-weight: 700
      }
      .empty-action h2 { margin-bottom: 8px }
      .empty-action .button { margin-top: 22px }
      .auth-page { min-height: 100vh; display: grid; grid-template-columns: 1.15fr .85fr; background: #f4f6f5 }
      .auth-visual {
        position: relative; display: flex; align-items: end; overflow: hidden; min-height: 100vh;
        color: #fff; background: linear-gradient(145deg, #103e33, #1c6b56)
      }
      .visual-grid {
        position: absolute; inset: 0; opacity: .16;
        background-image: linear-gradient(#fff5 1px, transparent 1px), linear-gradient(90deg, #fff5 1px, transparent 1px);
        background-size: 58px 58px; mask-image: linear-gradient(to top, #000, transparent 80%)
      }
      .visual-copy { position: relative; padding: 0 12% 13%; max-width: 650px }
      .visual-copy h1 { margin: 23px 0 20px; font: 700 clamp(38px, 5vw, 69px)/1 Manrope; letter-spacing: -3px }
      .visual-copy h1 em { color: #b9d58c; font-style: normal }
      .visual-copy p { max-width: 375px; color: #c0d6cd; font-size: 15px; line-height: 1.7 }
      .visual-meta { display: flex; gap: 25px; margin-top: 44px; color: #91b8a7; font: 600 9px Manrope; letter-spacing: 1.3px }
      .auth-panel { display: flex; align-items: center; justify-content: center; padding: 60px 8%; background: #fff }
      .auth-panel-inner { width: 100%; max-width: 350px }
      .auth-brand { color: var(--green-dark); margin-bottom: 85px }
      .auth-brand .brand-mark { color: #fff; background: var(--green) }
      .auth-heading { margin-bottom: 31px }
      .auth-heading h2 { margin: 0 0 8px; font: 700 28px Manrope; letter-spacing: -1.2px }
      .auth-heading p { color: var(--muted); font-size: 12px }
      .auth-links { display: flex; justify-content: center; gap: 11px; margin-top: 25px; font-size: 11px }
      .auth-note { margin-top: 75px; padding-top: 18px; border-top: 1px solid var(--line); color: #a0aaa5; text-align: center; font-size: 10px }
      .auth-note strong { color: var(--green) }
      .text-button { margin-top: 25px }
      .modal-backdrop {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: #0b271f73
      }
      .modal-box { width: min(100%, 370px); padding: 30px; background: #fff; text-align: center; box-shadow: 0 15px 50px #0000002e }
      .modal-box h3 { margin: 0 0 9px; font: 700 20px Manrope }
      .modal-box p { margin: 0 0 22px; color: var(--muted); font-size: 12px; line-height: 1.6 }

      @media(max-width:920px) {
        .auth-page { grid-template-columns: 1fr }
        .auth-visual { display: none }
        .auth-panel { min-height: 100vh }
        .main-content { padding: 35px 24px }
        .sidebar { width: 220px; flex-basis: 220px }
        .stats-grid { grid-template-columns: repeat(2, 1fr) }
        .content-grid { grid-template-columns: 1fr }
        .quick-panel { min-height: 250px }
      }
      @media(max-width:640px) {
        .app-shell { display: block }
        .sidebar { display: none }
        .main-content { padding: 0 16px 30px }
        .mobile-header {
          height: 70px; display: flex; align-items: center; gap: 10px; color: var(--green-dark); font: 600 13px Manrope
        }
        .mobile-header .brand-mark { width: 28px; height: 28px; font-size: 22px }
        .mobile-header button { margin-left: auto; border: 0; background: transparent; color: var(--green); font-size: 11px; font-weight: 700 }
        .page-header { display: block; margin: 25px 0 30px }
        .page-header .button { margin-top: 20px }
        .stats-grid { gap: 10px }
        .stat-card { min-height: 125px; padding: 16px }
        .stat-card strong { font-size: 28px }
        .panel { padding: 20px 16px }
        .form-grid { grid-template-columns: 1fr; gap: 0 }
        .form-footer { display: block }
        .form-footer .button { margin-top: 18px; width: 100% }
        .action-panel { display: block }
        .admin-actions { grid-template-columns: 1fr; margin-top: 24px }
        .visual-meta { display: none }
        .auth-panel { padding: 35px 25px }
        .auth-brand { margin-bottom: 65px }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useEffect, useState } = React;

      // =====================================================================
      // localStorage-backed store (replaces the MySQL/Express API).
      // Data is seeded once, then persisted across page refreshes.
      // =====================================================================
      const KEYS = {
        users: "helpdesk.users",
        tickets: "helpdesk.tickets",
        activities: "helpdesk.activities",
      };

      const seedUsers = [
        { id: "2404154", password: "123456student",    name: "Student User",   role: "student",    roleName: "Student",                  email: "student@campus.edu" },
        { id: "2404154", password: "123456employee",   name: "Employee User",  role: "employee",   roleName: "Employee",                 email: "employee@campus.edu" },
        { id: "2404154", password: "123456technician", name: "Technician User",role: "technician", roleName: "Technician",               email: "technician@campus.edu" },
        { id: "2404154", password: "123456admin",      name: "Users Admin",    role: "admin",      roleName: "Student / Employee Admin", email: "admin@campus.edu" },
        { id: "2404154", password: "123456superadmin", name: "Super Admin",    role: "superadmin", roleName: "Super Admin",              email: "superadmin@campus.edu" },
      ];

      const seedTickets = [
        { id: "#HD001", subject: "Wi-Fi Connection Problem", category: "Network",  priority: "High",   status: "Open" },
        { id: "#HD002", subject: "Computer Not Starting",    category: "Hardware", priority: "Medium", status: "In Progress" },
        { id: "#HD003", subject: "Password Reset",           category: "Account",  priority: "Low",    status: "Resolved" },
      ];

      const seedActivities = [
        ["Aug. 30, 2026 - 10:30 AM", "Super Admin",  "Super Admin", "Logged into the system"],
        ["Aug. 30, 2026 - 10:45 AM", "Maria Santos", "Student",     "Submitted ticket #HD015"],
        ["Aug. 30, 2026 - 11:00 AM", "Mark Cruz",    "Technician",  "Updated ticket #HD015"],
      ];

      const read = (key, fallback) => {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      };
      const write = (key, value) => localStorage.setItem(key, JSON.stringify(value));

      // Seed on first run only.
      if (!localStorage.getItem(KEYS.users)) write(KEYS.users, seedUsers);
      if (!localStorage.getItem(KEYS.tickets)) write(KEYS.tickets, seedTickets);
      if (!localStorage.getItem(KEYS.activities)) write(KEYS.activities, seedActivities);

      const store = {
        login({ id, password, role }) {
          const users = read(KEYS.users, seedUsers);
          const account = users.find((u) => u.id === id && u.role === role);
          if (!account || account.password !== password) {
            throw new Error("Incorrect ID, password, or selected role.");
          }
          store.addActivity({
            name: account.name,
            roleName: account.roleName,
            action: "Logged into the HelpDesk system",
          });
          return { id: account.id, name: account.name, role: account.role, roleName: account.roleName };
        },
        getTickets() {
          return read(KEYS.tickets, seedTickets);
        },
        createTicket({ subject, category, priority }) {
          const tickets = read(KEYS.tickets, seedTickets);
          const id = `#HD${String(tickets.length + 1).padStart(3, "0")}`;
          const ticket = { id, subject, category, priority, status: "Open" };
          write(KEYS.tickets, [ticket, ...tickets]);
          return ticket;
        },
        getActivities() {
          return read(KEYS.activities, seedActivities);
        },
        addActivity({ name, roleName, action }) {
          const activities = read(KEYS.activities, seedActivities);
          write(KEYS.activities, [[new Date().toLocaleString(), name, roleName, action], ...activities]);
        },
        getUsers() {
          const users = read(KEYS.users, seedUsers);
          return users.map((u) => ({ id: u.id, name: u.name, role: u.roleName, email: u.email }));
        },
        reset() {
          write(KEYS.users, seedUsers);
          write(KEYS.tickets, seedTickets);
          write(KEYS.activities, seedActivities);
        },
      };

      const navFor = {
        user: [
          ["userDashboard", "\u25C8", "Dashboard"],
          ["requestPage", "+", "Submit Request"],
          ["myRequestsPage", "\u25A4", "My Requests"],
        ],
        technician: [
          ["technicianDashboard", "\u25C8", "Dashboard"],
          ["technicianRequestsPage", "\u25A4", "Assigned Requests"],
        ],
        admin: [
          ["adminDashboard", "\u25C8", "Dashboard"],
          ["manageRequestsPage", "\u25A4", "Manage Requests"],
          ["usersPage", "\u2659", "Users"],
        ],
        superadmin: [
          ["superAdminDashboard", "\u25C8", "Dashboard"],
          ["usersPage", "\u2659", "Manage Users"],
          ["manageRequestsPage", "\u25A4", "Manage Requests"],
          ["activityLogPage", "\u25F7", "Activity Logs"],
        ],
      };

      function App() {
        const [authPage, setAuthPage] = useState("login");
        const [user, setUser] = useState(null);
        const [page, setPage] = useState("userDashboard");
        const [credentials, setCredentials] = useState({ id: "", password: "", role: "student" });
        const [tickets, setTickets] = useState([]);
        const [activities, setActivities] = useState([]);
        const [modal, setModal] = useState(null);
        const [request, setRequest] = useState({
          category: "Hardware", priority: "Medium", subject: "", location: "", description: "",
        });

        const roleType =
          user?.role === "superadmin" ? "superadmin"
          : user?.role === "admin" ? "admin"
          : user?.role === "technician" ? "technician"
          : "user";

        const addActivity = (activity) => {
          setActivities((items) => [
            [new Date().toLocaleString(), user.name, user.roleName, activity],
            ...items,
          ]);
          store.addActivity({ name: user.name, roleName: user.roleName, action: activity });
        };
        const showMessage = (title, message) => setModal({ title, message });

        // Load tickets and activities from localStorage once signed in.
        useEffect(() => {
          if (!user) return;
          setTickets(store.getTickets());
          setActivities(store.getActivities());
        }, [user]);

        function login(event) {
          event.preventDefault();
          let account;
          try {
            account = store.login(credentials);
          } catch (error) {
            showMessage("Login failed", error.message || "Incorrect ID, password, or selected role.");
            return;
          }
          setUser(account);
          const landing =
            account.role === "superadmin" ? "superAdminDashboard"
            : account.role === "admin" ? "adminDashboard"
            : account.role === "technician" ? "technicianDashboard"
            : "userDashboard";
          setPage(landing);
          setCredentials((current) => ({ ...current, password: "" }));
        }

        function submitRequest(event) {
          event.preventDefault();
          if (!request.subject.trim() || !request.location.trim() || !request.description.trim()) {
            showMessage("Incomplete form", "Please complete the subject, location, and description.");
            return;
          }
          const created = store.createTicket({
            subject: request.subject,
            category: request.category,
            priority: request.priority,
          });
          setTickets((items) => [created, ...items]);
          addActivity(`Submitted ${created.id}: ${created.subject}`);
          setRequest({ category: "Hardware", priority: "Medium", subject: "", location: "", description: "" });
          showMessage("Request submitted", `${created.id} was created successfully.`);
        }

        function logout() {
          setUser(null);
          setAuthPage("login");
          setCredentials({ id: "", password: "", role: "student" });
        }

        if (!user)
          return (
            <AuthScreen
              page={authPage} setPage={setAuthPage} credentials={credentials}
              setCredentials={setCredentials} login={login} showMessage={showMessage}
              modal={modal} setModal={setModal}
            />
          );

        return (
          <div className="app-shell">
            <aside className="sidebar">
              <div className="brand">
                <span className="brand-mark">+</span>
                <span>Campus<br /><strong>HelpDesk</strong></span>
              </div>
              <div className="sidebar-user">
                <span className="avatar">{user.name.charAt(0)}</span>
                <div>
                  <strong>{user.name}</strong>
                  <span>{user.roleName}</span>
                </div>
              </div>
              <nav className="nav-list">
                {navFor[roleType].map(([id, icon, label]) => (
                  <button className={page === id ? "active" : ""} key={id} onClick={() => setPage(id)}>
                    <span>{icon}</span>{label}
                  </button>
                ))}
              </nav>
              <button className="logout-button" onClick={logout}>
                <span>{"\u21AA"}</span>Log out
              </button>
              <div className="sidebar-footer">
                HELPDESK v1.0<br />
                <span>Support that keeps you moving.</span>
              </div>
            </aside>
            <main className="main-content">
              <header className="mobile-header">
                <span className="brand-mark">+</span>
                <strong>Campus HelpDesk</strong>
                <button onClick={logout}>Log out</button>
              </header>
              {page === "userDashboard" && <UserDashboard setPage={setPage} tickets={tickets} />}
              {page === "requestPage" && <RequestPage request={request} setRequest={setRequest} submitRequest={submitRequest} />}
              {page === "myRequestsPage" && <MyRequests tickets={tickets} setPage={setPage} />}
              {page === "technicianDashboard" && <TechnicianDashboard setPage={setPage} />}
              {page === "technicianRequestsPage" && <TechnicianRequests addActivity={addActivity} showMessage={showMessage} />}
              {(page === "adminDashboard" || page === "superAdminDashboard") && (
                <AdminDashboard type={page === "superAdminDashboard" ? "super" : "admin"} setPage={setPage} />
              )}
              {page === "manageRequestsPage" && <ManageRequests showMessage={showMessage} />}
              {page === "usersPage" && <UsersPage />}
              {page === "activityLogPage" && <ActivityLog activities={activities} />}
            </main>
            {modal && <Modal modal={modal} setModal={setModal} />}
          </div>
        );
      }

      function Modal({ modal, setModal }) {
        return (
          <div className="modal-backdrop" onClick={() => setModal(null)}>
            <div className="modal-box" onClick={(event) => event.stopPropagation()}>
              <div className="modal-icon">i</div>
              <h3>{modal.title}</h3>
              <p>{modal.message}</p>
              <button className="button button-primary" onClick={() => setModal(null)}>Okay</button>
            </div>
          </div>
        );
      }

      function AuthScreen({ page, setPage, credentials, setCredentials, login, showMessage, modal, setModal }) {
        const isSignup = page === "signup";
        const isForgot = page === "forgot";
        return (
          <div className="auth-page">
            <div className="auth-visual">
              <div className="visual-grid"></div>
              <div className="visual-copy">
                <span className="eyebrow">CAMPUS IT SERVICES</span>
                <h1>Support that<br /><em>keeps you moving.</em></h1>
                <p>One place to report, track, and resolve every technical concern across campus.</p>
                <div className="visual-meta">
                  <span>{"\u25C9"} &nbsp; 24 / 7 SUPPORT</span>
                  <span>{"\u2301"} &nbsp; CAMPUS-WIDE</span>
                </div>
              </div>
            </div>
            <div className="auth-panel">
              <div className="auth-panel-inner">
                <div className="auth-brand">
                  <span className="brand-mark">+</span>
                  <span>Campus<br /><strong>HelpDesk</strong></span>
                </div>
                {page === "login" && (
                  <>
                    <AuthHeading title="Welcome back" detail="Sign in to access your support workspace." />
                    <form onSubmit={login}>
                      <Field label="ID number" type="text" placeholder="e.g. 2404154"
                        value={credentials.id} onChange={(value) => setCredentials({ ...credentials, id: value })} />
                      <Field label="Password" type="password" placeholder="Enter your password"
                        value={credentials.password} onChange={(value) => setCredentials({ ...credentials, password: value })} />
                      <label className="field-label">
                        Login as
                        <select value={credentials.role}
                          onChange={(event) => setCredentials({ ...credentials, role: event.target.value })}>
                          <option value="student">Student</option>
                          <option value="employee">Employee</option>
                          <option value="technician">Technician</option>
                          <option value="admin">Student / Employee Admin</option>
                          <option value="superadmin">Super Admin</option>
                        </select>
                      </label>
                      <button className="button button-primary full-width" type="submit">Sign in <span>{"\u2192"}</span></button>
                    </form>
                    <AuthLinks onForgot={() => setPage("forgot")} onSignup={() => setPage("signup")} />
                  </>
                )}
                {isSignup && (
                  <>
                    <AuthHeading title="Create account" detail="Register as a student or employee." />
                    <form onSubmit={(event) => {
                      event.preventDefault();
                      showMessage("Account created", "Prototype account created successfully. You can now return to the login page.");
                      setPage("login");
                    }}>
                      <Field label="Full name" placeholder="Enter your full name" />
                      <Field label="ID number" placeholder="Student / Employee ID" />
                      <Field label="Email" type="email" placeholder="Enter email" />
                      <label className="field-label">
                        User type
                        <select><option>Student</option><option>Employee</option></select>
                      </label>
                      <Field label="Password" type="password" placeholder="Create password" />
                      <button className="button button-primary full-width" type="submit">Create account <span>{"\u2192"}</span></button>
                    </form>
                    <button className="text-button" onClick={() => setPage("login")}>{"\u2190"} Back to login</button>
                  </>
                )}
                {isForgot && (
                  <>
                    <AuthHeading title="Reset password" detail="Enter your registered email to receive a reset request." />
                    <form onSubmit={(event) => {
                      event.preventDefault();
                      showMessage("Reset request sent", "A password reset request has been simulated successfully.");
                    }}>
                      <Field label="Email address" type="email" placeholder="example@email.com" />
                      <button className="button button-primary full-width" type="submit">Send reset request <span>{"\u2192"}</span></button>
                    </form>
                    <button className="text-button" onClick={() => setPage("login")}>{"\u2190"} Back to login</button>
                  </>
                )}
                <div className="auth-note">Need help? Contact <strong>IT Support Services</strong></div>
              </div>
              {modal && <Modal modal={modal} setModal={setModal} />}
            </div>
          </div>
        );
      }

      function AuthHeading({ title, detail }) {
        return (<div className="auth-heading"><h2>{title}</h2><p>{detail}</p></div>);
      }
      function AuthLinks({ onForgot, onSignup }) {
        return (
          <div className="auth-links">
            <button onClick={onForgot}>Forgot password?</button>
            <span>{"\u00B7"}</span>
            <button onClick={onSignup}>Create account</button>
          </div>
        );
      }
      function Field({ label, type = "text", placeholder, value, onChange }) {
        return (
          <label className="field-label">
            {label}
            <input type={type} placeholder={placeholder} value={value ?? ""}
              onChange={(event) => onChange?.(event.target.value)} required />
          </label>
        );
      }
      function PageHeader({ eyebrow, title, description, action }) {
        return (
          <div className="page-header">
            <div>
              <span className="eyebrow">{eyebrow}</span>
              <h1>{title}</h1>
              <p>{description}</p>
            </div>
            {action}
          </div>
        );
      }
      function StatCard({ label, value, tone = "" }) {
        return (
          <div className={`stat-card ${tone}`}>
            <span>{label}</span>
            <strong>{value}</strong>
            <small>Compared with last month <b>{"\u2197"}</b></small>
          </div>
        );
      }
      function UserDashboard({ setPage, tickets }) {
        return (
          <>
            <PageHeader eyebrow="OVERVIEW / 01" title="Good morning, Student User."
              description="Here's what's happening with your support requests."
              action={<button className="button button-primary" onClick={() => setPage("requestPage")}>+ New request</button>} />
            <div className="stats-grid">
              <StatCard label="Total requests" value={tickets.length} />
              <StatCard label="Open" value={tickets.filter((t) => t.status === "Open").length} tone="gold" />
              <StatCard label="In progress" value={tickets.filter((t) => t.status === "In Progress").length} tone="blue" />
              <StatCard label="Resolved" value={tickets.filter((t) => t.status === "Resolved").length} tone="green" />
            </div>
            <div className="content-grid">
              <section className="panel panel-large">
                <div className="panel-heading">
                  <div>
                    <span className="eyebrow">RECENT ACTIVITY</span>
                    <h2>Your latest requests</h2>
                  </div>
                  <button className="link-button" onClick={() => setPage("myRequestsPage")}>View all {"\u2197"}</button>
                </div>
                <TicketTable tickets={tickets.slice(0, 3)} />
              </section>
              <section className="panel quick-panel">
                <span className="eyebrow">NEED A HAND?</span>
                <h2>What can we help with?</h2>
                <p>Report a technical concern and our team will get right on it.</p>
                <button className="button button-dark" onClick={() => setPage("requestPage")}>Submit a request <span>{"\u2192"}</span></button>
                <div className="support-line">Average response time <strong>under 2 hours</strong></div>
              </section>
            </div>
          </>
        );
      }
      function TicketTable({ tickets }) {
        return (
          <div className="table-wrap">
            <table>
              <thead>
                <tr><th>Ticket</th><th>Subject</th><th>Category</th><th>Priority</th><th>Status</th></tr>
              </thead>
              <tbody>
                {tickets.map((ticket) => (
                  <tr key={ticket.id}>
                    <td><strong>{ticket.id}</strong></td>
                    <td>{ticket.subject}</td>
                    <td>{ticket.category}</td>
                    <td><Priority value={ticket.priority} /></td>
                    <td><Status value={ticket.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }
      function Priority({ value }) {
        return (<span className={`priority priority-${value.toLowerCase()}`}>{value}</span>);
      }
      function Status({ value }) {
        return (<span className={`status status-${value.toLowerCase().replace(" ", "-")}`}><i></i>{value}</span>);
      }
      function RequestPage({ request, setRequest, submitRequest }) {
        return (
          <>
            <PageHeader eyebrow="SUPPORT / 02" title="Submit a request"
              description="Tell us what's going on. The more detail, the faster we can help." />
            <form className="panel request-form" onSubmit={submitRequest}>
              <div className="form-intro">
                <span className="form-number">01</span>
                <div><h2>Request details</h2><p>Give us the basics about your technical concern.</p></div>
              </div>
              <div className="form-grid">
                <SelectField label="Category" value={request.category}
                  options={["Hardware", "Network / Internet", "Software", "Account / Login", "Printer", "Others"]}
                  onChange={(value) => setRequest({ ...request, category: value })} />
                <SelectField label="Priority" value={request.priority}
                  options={["Low", "Medium", "High"]}
                  onChange={(value) => setRequest({ ...request, priority: value })} />
              </div>
              <Field label="Subject" placeholder="Example: Cannot connect to Wi-Fi"
                value={request.subject} onChange={(value) => setRequest({ ...request, subject: value })} />
              <Field label="Location" placeholder="Example: Computer Laboratory 2"
                value={request.location} onChange={(value) => setRequest({ ...request, location: value })} />
              <label className="field-label">
                Description
                <textarea placeholder="Describe your problem here..." value={request.description}
                  onChange={(event) => setRequest({ ...request, description: event.target.value })} required />
              </label>
              <div className="form-footer">
                <span>We'll use these details to route your request.</span>
                <button className="button button-primary" type="submit">Submit request <span>{"\u2192"}</span></button>
              </div>
            </form>
          </>
        );
      }
      function SelectField({ label, value, options, onChange }) {
        return (
          <label className="field-label">
            {label}
            <select value={value} onChange={(event) => onChange(event.target.value)}>
              {options.map((option) => (<option key={option}>{option}</option>))}
            </select>
          </label>
        );
      }
      function MyRequests({ tickets, setPage }) {
        return (
          <>
            <PageHeader eyebrow="REQUESTS / 03" title="My requests"
              description="A clear view of everything you've sent our way."
              action={<button className="button button-primary" onClick={() => setPage("requestPage")}>+ New request</button>} />
            <section className="panel">
              <div className="panel-heading">
                <div><span className="eyebrow">ALL TICKETS</span><h2>Request history</h2></div>
                <span className="table-count">{tickets.length} total</span>
              </div>
              <TicketTable tickets={tickets} />
            </section>
          </>
        );
      }
      function AdminDashboard({ type, setPage }) {
        const stats = type === "super"
          ? [["Total users", "420"], ["Total tickets", "54"], ["Technicians", "8"], ["Resolved tickets", "39"]]
          : [["Students", "245"], ["Employees", "91"], ["Pending requests", "14"], ["Resolved requests", "31"]];
        return (
          <>
            <PageHeader eyebrow={type === "super" ? "SYSTEM / 01" : "ADMIN / 01"}
              title={type === "super" ? "System overview." : "Users administration."}
              description={type === "super"
                ? "A pulse check across the entire HelpDesk system."
                : "Manage student and employee requests from one place."} />
            <div className="stats-grid">
              {stats.map(([label, value]) => (<StatCard key={label} label={label} value={value} />))}
            </div>
            <section className="panel action-panel">
              <div><span className="eyebrow">QUICK ACCESS</span><h2>Keep things moving.</h2></div>
              <div className="admin-actions">
                <button onClick={() => setPage("manageRequestsPage")}>
                  <span>{"\u25A4"}</span><strong>Manage requests</strong><small>Review and assign tickets</small>
                </button>
                <button onClick={() => setPage("usersPage")}>
                  <span>{"\u2659"}</span><strong>Manage users</strong><small>View registered users</small>
                </button>
                {type === "super" && (
                  <button onClick={() => setPage("activityLogPage")}>
                    <span>{"\u25F7"}</span><strong>Activity logs</strong><small>See recent system actions</small>
                  </button>
                )}
              </div>
            </section>
          </>
        );
      }
      function TechnicianDashboard({ setPage }) {
        return (
          <>
            <PageHeader eyebrow="TECHNICIAN / 01" title="Your work queue."
              description="View and manage the support requests assigned to you." />
            <div className="stats-grid">
              <StatCard label="Assigned tickets" value="9" />
              <StatCard label="Open" value="3" tone="gold" />
              <StatCard label="In progress" value="4" tone="blue" />
              <StatCard label="Completed today" value="2" tone="green" />
            </div>
            <section className="panel empty-action">
              <div className="empty-icon">{"\u2713"}</div>
              <h2>Ready when you are.</h2>
              <p>There are 9 requests waiting for your attention.</p>
              <button className="button button-primary" onClick={() => setPage("technicianRequestsPage")}>
                View assigned requests <span>{"\u2192"}</span>
              </button>
            </section>
          </>
        );
      }
      function TechnicianRequests({ addActivity, showMessage }) {
        const [resolved, setResolved] = useState(false);
        return (
          <>
            <PageHeader eyebrow="TECHNICIAN / 02" title="Assigned requests"
              description="Technical issues currently assigned to you." />
            <section className="panel">
              <div className="panel-heading">
                <div><span className="eyebrow">YOUR QUEUE</span><h2>Active tickets</h2></div>
              </div>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr><th>Ticket</th><th>User</th><th>Issue</th><th>Priority</th><th>Status</th><th>Action</th></tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><strong>#HD021</strong></td>
                      <td>Maria Santos</td>
                      <td>Computer cannot start</td>
                      <td><Priority value="High" /></td>
                      <td><Status value={resolved ? "Resolved" : "Open"} /></td>
                      <td>
                        <button className="table-button" disabled={resolved} onClick={() => {
                          setResolved(true);
                          addActivity("Resolved ticket #HD021");
                          showMessage("Ticket resolved", "Ticket #HD021 has been marked as resolved.");
                        }}>{resolved ? "Resolved" : "Resolve"}</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </>
        );
      }
      function ManageRequests({ showMessage }) {
        return (
          <>
            <PageHeader eyebrow="MANAGEMENT / 02" title="Request management"
              description="Review, assign, and monitor submitted tickets." />
            <section className="panel">
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr><th>Ticket</th><th>User</th><th>Role</th><th>Issue</th><th>Status</th><th>Action</th></tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><strong>#HD015</strong></td>
                      <td>Maria Santos</td>
                      <td>Student</td>
                      <td>Wi-Fi problem</td>
                      <td><Status value="Open" /></td>
                      <td>
                        <button className="table-button" onClick={() =>
                          showMessage("Technician assigned", "The ticket was assigned successfully.")}>Assign</button>
                      </td>
                    </tr>
                    <tr>
                      <td><strong>#HD016</strong></td>
                      <td>Jose Reyes</td>
                      <td>Employee</td>
                      <td>Printer error</td>
                      <td><Status value="In Progress" /></td>
                      <td>
                        <button className="table-button light" onClick={() =>
                          showMessage("Ticket details", "This ticket is currently being handled by a technician.")}>View</button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </>
        );
      }
      function UsersPage() {
        const [users, setUsers] = useState([]);
        useEffect(() => { setUsers(store.getUsers()); }, []);
        return (
          <>
            <PageHeader eyebrow="DIRECTORY / 03" title="Users"
              description="Registered users across the HelpDesk system." />
            <section className="panel">
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr><th>ID</th><th>Name</th><th>Role</th><th>Email</th><th>Status</th></tr>
                  </thead>
                  <tbody>
                    {users.map((u, index) => (
                      <tr key={`${u.id}-${index}`}>
                        <td><strong>{u.id}</strong></td>
                        <td>{u.name}</td>
                        <td>{u.role}</td>
                        <td>{u.email}</td>
                        <td><Status value="Active" /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>
          </>
        );
      }
      function ActivityLog({ activities }) {
        return (
          <>
            <PageHeader eyebrow="SYSTEM / 04" title="Activity log"
              description="Recent actions performed inside the prototype." />
            <section className="panel">
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr><th>Date / time</th><th>User</th><th>Role</th><th>Activity</th></tr>
                  </thead>
                  <tbody>
                    {activities.map((activity, index) => (
                      <tr key={`${activity[0]}-${index}`}>
                        {activity.map((item, i) => (<td key={i}>{item}</td>))}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
